<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>תמונת תצוגה לקישור | D Consulting</title>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary:#2C6CC5; --text:#131D2F; --muted:#5E6E82; --bg:#FFFFFF; --bg-soft:#F7F9FB; --border:#DDE4EC; --gold:#D7B254; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { margin:0; background:#E8EEF5; color:var(--text); font-family:'Heebo',sans-serif; direction:rtl; -webkit-font-smoothing:antialiased; }
    .nw { white-space:nowrap; }
    .canvas { width:1200px; height:630px; background:var(--bg); padding:38px 48px 30px; display:flex; flex-direction:column; justify-content:space-between; }
    .header-row { display:flex; align-items:center; justify-content:space-between; }
    .header-logo { display:block; width:230px; height:auto; }
    .hiring-badge { background:#F1F6FD; color:var(--primary); border:1.5px solid #C5DBF8; border-radius:8px; padding:6px 22px; font-size:26px; font-weight:700; }
    .title-section { display:flex; flex-direction:column; gap:6px; }
    h1 { font-family:'Frank Ruhl Libre',serif; font-size:50px; font-weight:700; line-height:1.15; }
    .subline { font-size:26px; font-weight:500; color:#34415a; }
    .benefits-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; }
    .benefit-card { background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:12px 20px; display:flex; align-items:center; gap:16px; }
    .icon-circle { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .icon-gold { background:var(--gold); color:#fff; font-weight:700; font-size:24px; line-height:1; }
    .icon-blue { background:var(--primary); }
    .icon-blue svg { width:22px; height:22px; stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .benefit-text { font-size:26px; font-weight:600; white-space:nowrap; }
    .bottom-section { display:flex; flex-direction:column; gap:10px; }
    .blue-bar { background:var(--primary); border-radius:10px; padding:13px 28px; display:flex; align-items:center; justify-content:center; gap:16px; color:#fff; }
    .bar-label { font-size:28px; font-weight:600; }
    .bar-url { font-size:28px; font-weight:700; direction:ltr; }
    .signature-line { text-align:center; font-size:20px; font-weight:500; color:var(--muted); }
  </style>
</head>
<body>
  <div class="canvas">
    <header class="header-row">
      <img src="https://dconsult.me/assets/logo-light.png" alt="D Consulting" class="header-logo">
      <div class="hiring-badge">דרושים</div>
    </header>
    <div class="title-section">
      <h1>אנליסט/ית ניהול תשואה והפצה למלונות</h1>
      <p class="subline">עבודה בצד הדיגיטלי של המלונאות, עם <span class="nw"><bdi>Booking</bdi></span>, <span class="nw"><bdi>Expedia</bdi></span> <span class="nw">ו-<bdi>Airbnb</bdi></span></p>
    </div>
    <div class="benefits-grid">
      <div class="benefit-card"><div class="icon-circle icon-gold">&#8362;</div><span class="benefit-text">שכר גבוה למתאימים</span></div>
      <div class="benefit-card"><div class="icon-circle icon-blue"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="benefit-text">15-25 שעות בשבוע</span></div>
      <div class="benefit-card"><div class="icon-circle icon-blue"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="benefit-text">רוב העבודה מהבית</span></div>
      <div class="benefit-card"><div class="icon-circle icon-blue"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="benefit-text">הכשרה מלאה בשכר</span></div>
    </div>
    <div class="bottom-section">
      <div class="blue-bar"><span class="bar-label">לפרטים ולהגשת קורות חיים</span><span class="bar-url">dconsult.me/jobs/analyst</span></div>
      <div class="signature-line">איתי גל, D Consulting · המשרה מיועדת לנשים ולגברים כאחד</div>
    </div>
  </div>
</body>
</html>
